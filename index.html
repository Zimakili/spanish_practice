    <!-- Application Structure Plan: A single-page application with a clear, dual-mode structure selected via tabs: "Tarjetas (Flashcards)" and "Prueba de Traducción (Quiz)". This design directly addresses the user's request for two distinct practice methods. The flashcard mode is for initial learning and review, while the quiz mode is for testing knowledge retention. Filters for word rank and part of speech are included in both modes to allow for focused, customized study sessions, catering to learners at different levels. The structure is task-oriented, making it highly intuitive for a student to choose how they want to engage with the vocabulary. -->
    <!-- Visualization & Content Choices: 1. Flashcards (HTML/CSS/JS): Goal=Inform/Memorize, Interaction=Flip/Next/Previous/Filter. Justification=Classic and effective method for vocabulary learning. The flip animation provides satisfying feedback. 2. Translation Quiz (HTML/JS): Goal=Test/Reinforce, Interaction=Multiple Choice Selection/Next/Filter. Justification=Actively tests recall and recognition, which is a step beyond passive review. Immediate feedback and scoring gamify the experience. No charts are needed as the goal is practice, not data analysis. -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

        .perspective {

            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            border-radius: 0.5rem;
            border: 1px solid #e7e5e4;
        }
        .flip-card-back {
            transform: rotateY(180deg);
        }
        .active-nav {
            background-color: #0d9488;
            color: white;
        }
        .inactive-nav {
            color: #57534e;
            background-color: #f5f5f4;
        }
        .correct-answer {

            border-color: #22c55e !important;
        }
        .wrong-answer {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
        }
    </style>

        };

        function parseCSV(data) {
            const lines = data.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.replace(/"/g, ''));
            const words = [];
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].match(/(?:"[^"]*"|[^,]+)/g).map(v => v.replace(/"/g, ''));
                if (values && values.length === headers.length) {
                    const wordObject = {};
                    for (let j = 0; j < headers.length; j++) {
                        wordObject[headers[j]] = values[j] || '';
                    }
                    words.push(wordObject);
                }
            }
            return words;
        }
        
        function switchView(view) {
            document.getElementById('flashcardView').classList.toggle('hidden', view !== 'flashcard');
            document.getElementById('quizView').classList.toggle('hidden', view !== 'quiz');
            document.getElementById('flashcardBtn').classList.toggle('active-nav', view === 'flashcard');
            document.getElementById('flashcardBtn').classList.toggle('inactive-nav', view !== 'flashcard');
            document.getElementById('quizBtn').classList.toggle('active-nav', view === 'quiz');
            document.getElementById('quizBtn').classList.toggle('inactive-nav', view !== 'quiz');
        }

        function populateFilters() {
            const partsOfSpeech = [...new Set(allWords.map(word => word['Part of Speech']))].sort();
            const flashcardPosFilter = document.getElementById('flashcard-posFilter');
            const quizPosFilter = document.getElementById('quiz-posFilter');
            partsOfSpeech.forEach(pos => {
                if (posMap[pos]) {
                    const option1 = new Option(posMap[pos], pos);
                    const option2 = new Option(posMap[pos], pos);
                    flashcardPosFilter.add(option1);
                    quizPosFilter.add(option2);
                }
            });
        }
        
        function applyFlashcardFilters() {
            const posFilter = document.getElementById('flashcard-posFilter').value;
            const rankFilter = document.getElementById('flashcard-rankFilter').value.split('-').map(Number);

            practiceWords = allWords.filter(word => {
                const rank = parseInt(word.Rank);
                const posMatch = posFilter ? word['Part of Speech'] === posFilter : true;
                const rankMatch = rank >= rankFilter[0] && rank <= rankFilter[1];
                return posMatch && rankMatch;
            });
            
            currentCardIndex = 0;
            updateFlashcard();
            updateCardCounter();
        }

        function updateFlashcard() {
            const card = document.getElementById('flashcard');
            card.classList.remove('flipped');
            
            if (practiceWords.length === 0) {
                 document.getElementById('flashcard-front').innerHTML = `<p class="text-xl text-stone-500">No hay palabras con esos filtros.</p>`;
                document.getElementById('flashcard-back').innerHTML = '';
                return;
            }

            const word = practiceWords[currentCardIndex];
            document.getElementById('flashcard-front').innerHTML = `<h2 class="text-5xl font-bold">${word['Spanish Word']}</h2>`;
            document.getElementById('flashcard-back').innerHTML = `
                <h3 class="text-3xl font-bold mb-2">${word['English Equivalent']}</h3>
                <p class="text-lg text-teal-700 font-semibold mb-4">${posMap[word['Part of Speech']] || word['Part of Speech']}</p>
                <p class="text-md text-stone-600 italic text-center">"${word['Sample Sentence']}"</p>
            `;
        }
        
         function updateCardCounter() {
            const counterEl = document.getElementById('card-counter');
            const countEl = document.getElementById('flashcard-count');
            if (practiceWords.length > 0) {
                counterEl.textContent = `${currentCardIndex + 1} / ${practiceWords.length}`;
                 countEl.textContent = `${practiceWords.length} tarjetas en este set.`;
            } else {
                counterEl.textContent = '0 / 0';
                countEl.textContent = 'No hay tarjetas en este set.';
            }
        }
        
        function setupQuiz() {
            const posFilter = document.getElementById('quiz-posFilter').value;
            const rankFilter = document.getElementById('quiz-rankFilter').value.split('-').map(Number);

            let quizWords = allWords.filter(word => {
                const rank = parseInt(word.Rank);
                const posMatch = posFilter ? word['Part of Speech'] === posFilter : true;
                const rankMatch = rank >= rankFilter[0] && rank <= rankFilter[1];
                return posMatch && rankMatch;
            });

            quizState.questions = quizWords.sort(() => 0.5 - Math.random());
            quizState.currentQuestionIndex = 0;
            quizState.correct = 0;
            quizState.total = 0;
            
            document.getElementById('quiz-start-message').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');

            generateQuestion();
        }
        
        function generateQuestion() {
            if (quizState.currentQuestionIndex >= quizState.questions.length) {
                document.getElementById('quiz-word').textContent = '¡Prueba Completada!';
                document.getElementById('quiz-options').innerHTML = '';
                document.getElementById('quiz-feedback').textContent = `Resultado final: ${quizState.correct} de ${quizState.total} correctas.`;
                document.getElementById('nextQuestionBtn').classList.add('hidden');
                document.getElementById('startQuizBtn').textContent = 'Comenzar de Nuevo';
                document.getElementById('startQuizBtn').classList.remove('hidden');
                return;
            }

            const currentWord = quizState.questions[quizState.currentQuestionIndex];
            let options = [currentWord];
            
            let distractors = allWords.filter(w => w.Rank !== currentWord.Rank && w['Part of Speech'] === currentWord['Part of Speech']);
            distractors.sort(() => 0.5 - Math.random());
            
            for(let i = 0; options.length < 4 && i < distractors.length; i++) {
                if(!options.find(o => o.Rank === distractors[i].Rank)) {
                     options.push(distractors[i]);
                }
            }
             while(options.length < 4) {
                let randomWord = allWords[Math.floor(Math.random() * allWords.length)];
                 if(!options.find(o => o.Rank === randomWord.Rank)) {
                     options.push(randomWord);
                 }
            }


            options.sort(() => 0.5 - Math.random());

            document.getElementById('quiz-word').textContent = currentWord['Spanish Word'];
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            
            options.forEach(opt => {
                const button = document.createElement('button');
                button.className = 'p-4 border border-stone-300 rounded-md text-left hover:bg-stone-100 disabled:opacity-75';
                button.textContent = opt['English Equivalent'];
                button.dataset.rank = opt.Rank;
                button.addEventListener('click', checkAnswer);
                optionsContainer.appendChild(button);
            });
            
            document.getElementById('quiz-feedback').textContent = '';
            document.getElementById('nextQuestionBtn').classList.add('hidden');
            document.getElementById('startQuizBtn').classList.add('hidden');
            updateScore();
        }
        
        function checkAnswer(event) {
            const selectedRank = event.target.dataset.rank;
            const correctRank = quizState.questions[quizState.currentQuestionIndex].Rank;
            
            const options = document.querySelectorAll('#quiz-options button');
            options.forEach(btn => {
                btn.disabled = true;
                if (btn.dataset.rank === correctRank) {
                    btn.classList.add('correct-answer');
                }
            });
            
            quizState.total++;
            if (selectedRank === correctRank) {
                quizState.correct++;
                document.getElementById('quiz-feedback').textContent = '¡Correcto!';
                document.getElementById('quiz-feedback').className = 'mt-4 text-center font-semibold text-green-600';
            } else {
                event.target.classList.add('wrong-answer');
                document.getElementById('quiz-feedback').textContent = `Incorrecto. La respuesta era "${quizState.questions[quizState.currentQuestionIndex]['English Equivalent']}".`;
                 document.getElementById('quiz-feedback').className = 'mt-4 text-center font-semibold text-red-600';
            }
            
            updateScore();
            document.getElementById('nextQuestionBtn').classList.remove('hidden');
        }

        function updateScore() {
            document.getElementById('quiz-score').textContent = `Puntaje: ${quizState.correct}/${quizState.total}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            allWords = parseCSV(csvData);
            populateFilters();
            applyFlashcardFilters();
            
            document.getElementById('flashcardBtn').addEventListener('click', () => switchView('flashcard'));
            document.getElementById('quizBtn').addEventListener('click', () => switchView('quiz'));

            document.getElementById('flashcard').addEventListener('click', () => {
                document.getElementById('flashcard').classList.toggle('flipped');
            });
            
            document.getElementById('nextCard').addEventListener('click', () => {
                currentCardIndex = (currentCardIndex + 1) % practiceWords.length;
                updateFlashcard();
                updateCardCounter();
            });

            document.getElementById('prevCard').addEventListener('click', () => {
                currentCardIndex = (currentCardIndex - 1 + practiceWords.length) % practiceWords.length;
                updateFlashcard();
                updateCardCounter();
            });

            document.getElementById('flashcard-posFilter').addEventListener('change', applyFlashcardFilters);
            document.getElementById('flashcard-rankFilter').addEventListener('change', applyFlashcardFilters);
            
            document.getElementById('startQuizBtn').addEventListener('click', setupQuiz);
            document.getElementById('nextQuestionBtn').addEventListener('click', () => {
                quizState.currentQuestionIndex++;
                generateQuestion();
            });

            document.getElementById('quiz-posFilter').addEventListener('change', () => {
                 document.getElementById('quiz-container').classList.add('hidden');
                 document.getElementById('quiz-start-message').classList.remove('hidden');
            });
            document.getElementById('quiz-rankFilter').addEventListener('change', () => {
                document.getElementById('quiz-container').classList.add('hidden');
                document.getElementById('quiz-start-message').classList.remove('hidden');
            });

        });
    </script>
</body>
</html>
